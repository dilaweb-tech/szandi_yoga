# Élesítés: minden ügyféloldal ENNEK a repónak egy külön klónja a tárhelyen,
# tehát az élesítés ott is `git pull`. Ügyfeleket viszont NEM frissítünk
# magától: ez a munkafolyamat csak kézzel indul, és megmondod, melyik oldalt.
#
# EGYSZERI BEÁLLÍTÁS (Settings → Secrets and variables → Actions):
#   SSH_HOST, SSH_USER, SSH_KEY, SSH_KNOWN_HOSTS, SSH_PORT (nem kötelező)
#   SSH_KNOWN_HOSTS: `ssh-keyscan -p PORT HOST` kimenete – nélküle nem indul,
#   mert kulcs-ellenőrzés nélkül egy hamis szerver is megkaphatná a deployt.
#
# A könyvtárat futtatáskor adod meg – így egy elgépelt titok nem visz ki
# véletlenül semmit rossz helyre.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      dir:
        description: "Az ügyféloldal könyvtára a tárhelyen (pl. /home/UGYFEL/sites/fodrasz.hu/public_html)"
        required: true
      branch:
        description: "Melyik ágról"
        required: true
        default: main

# A munkafolyamat csak olvas a repóból – egy feltört lépés se írhasson bele.
permissions:
  contents: read

concurrency:
  group: deploy-termek
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node test-site.mjs

      - name: SSH előkészítés
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          KNOWN: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "${SSH_KEY:-}" ] || { echo "Hiányzik az SSH_KEY titok – lásd a fájl fejlécét."; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          [ -n "${KNOWN:-}" ] || { echo "Hiányzik az SSH_KNOWN_HOSTS titok – lásd a fájl fejlécét."; exit 1; }
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts

      - name: Élesítés (git pull az ügyfél könyvtárában)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DIR: ${{ inputs.dir }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          # A két bemenet a távoli shellbe kerül: csak útvonal- és ágnév-karakter mehet.
          [[ "$DIR" =~ ^/[A-Za-z0-9._/-]+$ && "$DIR" != *..* ]] || { echo "Érvénytelen könyvtár: $DIR"; exit 1; }
          [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Érvénytelen ág: $BRANCH"; exit 1; }
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "set -e; cd '$DIR'; git fetch --quiet origin '$BRANCH'; git merge --ff-only 'origin/$BRANCH'; git log --oneline -1"
