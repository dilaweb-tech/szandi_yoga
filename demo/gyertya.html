<!doctype html>
<html lang="hu" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Élő gyertya</title>
<!--
  ÉLŐ GYERTYA – önálló bemutató
  ==============================
  Egyetlen fájl, külső függőség nélkül: minden kép SVG data-URI a CSS-ben.
  Ugyanaz a kód, ami a szandi_yoga oldalon (pv.css, „ÉLŐ GYERTYA" blokk) és a
  DilaWEB sablonban háttérelemként fut – itt kiemelve, középre téve.

  FELÉPÍTÉS – két elem egy közös, négyzet alakú dobozban (.candle); minden
  méret a doboz %-a, így bármekkorára skálázható:

  1) .candle__body – a gyertya TESTE. Maszk (--sv-candle-body: a henger, a
     túlfolyó csepp, a kanóc és a tál sziluettje egy 24×24-es rácson) vágja ki
     az alakot; a színt és a fényt egymásra rakott CSS-átmenetek adják, felülről:
       részlet-réteg (--sv-candle-detail: olvadt perem, csorgások, kanóc,
       árnyékok – csak áttetsző fehér/fekete, ezért bármilyen színen jó)
       · olvadt viasztó · a láng fénye a viaszban · meleg fény a gyertya tetején
       · a henger alsó íve · hengeres fény-árnyék · túlfolyó csepp
       · a tál pereme, belseje, teste · árnyék a felületen.
     A színek tokenek: --pv-candle-wax, --pv-candle-dish, --pv-candle-shade,
     --pv-candle-glow – más palettához csak ezeket kell cserélni.

  2) .candle__flame – a LÁNG és mögötte a meleg fény. Könnycsepp-SVG
     (--sv-flame-live: a lángforma SMIL-lel hullámzik; --sv-flame: álló kép
     csökkentett mozgáshoz). Három, egymással nem osztható ütemű CSS-mozdulat
     (lobbanás, kilengés, fényerő) – a pislákolás így sosem ismétlődik
     láthatóan. A láng töve maszkkal áttetsző: a kanóc átsejlik rajta.

  GEOMETRIA: a gyertya teteje egy ellipszis (12/11.15, rx 3.4, ry .62 a
  24-es rácson) – ebből rajzol a viasztó, a perem fénye, a függöny és minden
  csorgás teteje. A henger alja és a tál pereme ugyanakkora rálátással
  (ry/rx ≈ .18) készül, ezért ül bele a gyertya a tálba. A láng a doboz
  12% széles, 30% magas sávja, a töve 45%-on.
-->
<style>
  /* A gyertya színei – más palettához ezt a blokkot kell cserélni */
  :root {
    --pv-primary: #556B2F;
    --pv-candle-wax: color-mix(in srgb, #F5DEB3 60%, #FFFBF3);
    --pv-candle-dish: #5B3F3E;
    --pv-candle-shade: #2a1d14;
    --pv-candle-glow: #ffc75a;
    --pv-candle-o: 1;
    --pv-flame-o: 0.9;
    --page-bg: #A7B58C;
    --page-ink: #141414;
  }
  :root[data-theme="dark"] { --page-ink: #F7EFEF; --pv-flame-o: 1; }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 1.2rem;
    padding: 1.5rem 1rem;
    background: var(--page-bg);
    color: var(--page-ink);
    font: 400 1rem/1.5 system-ui, sans-serif;
    transition: background-color .4s, color .4s;
  }
  h1 { margin: 0; font: 400 clamp(1.5rem, 5vw, 2.2rem)/1.2 Georgia, serif; }
  p { margin: 0; max-width: 34rem; text-align: center; opacity: .8; }
  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; }
  .controls button {
    min-height: 44px; padding: .5rem 1rem;
    border: 1px solid currentColor; border-radius: 999px;
    background: transparent; color: inherit; font: inherit; cursor: pointer;
  }
  .controls button[aria-pressed="true"] { background: var(--page-ink); color: var(--page-bg); }
  :focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

  /* A doboz: négyzet, minden méret ennek %-a */
  .candle { position: relative; width: min(86vw, 26rem); aspect-ratio: 1; }

  /* 1) A TEST – a pv.css-ből kiemelve */
  .candle__body {
    position: absolute;
    inset: 0;
    -webkit-mask: var(--m) center / contain no-repeat;
    mask: var(--m) center / contain no-repeat;
    --m: var(--sv-candle-body);
    --a: none;
    --w: var(--pv-candle-wax, color-mix(in srgb, #f7eddd 88%, var(--pv-primary)));
    --d: var(--pv-candle-dish, color-mix(in srgb, var(--pv-primary) 55%, #2b1f18));
    --sh: var(--pv-candle-shade, #2a1d14);
    --g: var(--pv-candle-glow, #ffc75a);
    --din: color-mix(in srgb, var(--d) 80%, var(--sh));
    opacity: var(--pv-candle-o, 0.9);
    background:
      /* részletek: olvadt perem, csorgások, kanóc, árnyék a tálban */
      var(--sv-candle-detail) center / contain no-repeat,
      /* olvadt viasztó – a láng megvilágítja */
      radial-gradient(ellipse 14.17% 2.58% at 50% 46.46%,
        color-mix(in srgb, var(--g) 55%, #fff) 0%, color-mix(in srgb, var(--g) 30%, var(--w)) 45%,
        var(--w) 72%, color-mix(in srgb, #fff 28%, var(--w)) 86%, color-mix(in srgb, var(--sh) 18%, var(--w)) 96%, transparent 100%),
      /* a láng átszűrődő fénye a viasz felső részében */
      radial-gradient(ellipse 18% 11% at 50% 48.5%,
        color-mix(in srgb, var(--g) 50%, transparent), color-mix(in srgb, var(--g) 16%, transparent) 50%, transparent 100%),
      /* a láng meleg fénye rávetül a gyertya felső harmadára */
      linear-gradient(color-mix(in srgb, var(--g) 28%, transparent), transparent 36%) 50% 81.95% / 28.33% 46.92% no-repeat,
      /* a henger alsó íve: a két sarokba a tál belseje kerül – így az alja
         pontosan azon az íven ül, amelyiken a tál pereme fut */
      radial-gradient(ellipse 50% 100% at 50% 0%, transparent 95.5%, var(--din) 100%) 50% 90.17% / 28.33% 2.5% no-repeat,
      /* a henger: lefelé sötétedés + hengeres fény balról */
      linear-gradient(transparent 20%, color-mix(in srgb, var(--sh) 20%, transparent) 96%) 50% 81.95% / 28.33% 46.92% no-repeat,
      linear-gradient(90deg,
        color-mix(in srgb, var(--sh) 40%, var(--w)) 0%, color-mix(in srgb, var(--sh) 12%, var(--w)) 14%,
        color-mix(in srgb, #fff 30%, var(--w)) 24%, color-mix(in srgb, #fff 60%, var(--w)) 29%,
        color-mix(in srgb, #fff 30%, var(--w)) 34%, var(--w) 48%, color-mix(in srgb, var(--sh) 9%, var(--w)) 66%,
        color-mix(in srgb, var(--sh) 30%, var(--w)) 84%, color-mix(in srgb, var(--g) 18%, var(--w)) 92%,
        color-mix(in srgb, var(--sh) 45%, var(--w)) 100%)
        50% 81.95% / 28.33% 46.92% no-repeat,
      /* az élen túlfolyó csepp */
      linear-gradient(color-mix(in srgb, var(--sh) 18%, var(--w)), color-mix(in srgb, var(--sh) 18%, var(--w)))
        66% 51% / 3% 14% no-repeat,
      /* a tál pereme: világos gyűrű a belső és a külső ellipszis között */
      radial-gradient(ellipse 23.33% 4.167% at 50% 87.5%, transparent 88.5%,
        color-mix(in srgb, var(--d) 45%, color-mix(in srgb, #fff 70%, var(--g))) 91.5%, color-mix(in srgb, var(--d) 78%, #fff) 95%, var(--d) 97.5%, transparent 100%),
      /* a tál belseje: egyszínű, a pereme alatt sötétebb */
      radial-gradient(ellipse 21.25% 3.75% at 50% 87.5%, var(--din) 90%, color-mix(in srgb, var(--d) 55%, var(--sh)) 100%, transparent 100%),
      /* a tál teste elöl – ellipszis, hogy pontosan a tál alsó ívét kövesse */
      radial-gradient(ellipse 22.92% 4.375% at 50% 88.96%,
        color-mix(in srgb, var(--d) 85%, var(--sh)) 0%, color-mix(in srgb, var(--d) 50%, var(--sh)) 97%, transparent 100%),
      /* a tál lágy árnyéka a felületen */
      radial-gradient(ellipse 27% 3% at 50% 93.5%,
        color-mix(in srgb, var(--sh) 40%, transparent), color-mix(in srgb, var(--sh) 14%, transparent) 60%, transparent 100%);
  }

  /* 2) A LÁNG – a pv.css-ből kiemelve; itt mindig a hullámzó lángforma él */
  .candle__flame {
    inset: 0;
    --pv-flame-img: var(--sv-flame-live);
    animation: var(--pv-glow-a);
    position: absolute;
    z-index: 1;
    aspect-ratio: 1;
    pointer-events: none;
    transform-origin: 50% 45%;
    background:
      var(--pv-flame-img, var(--sv-flame)) 50% 21.43% / 12% 30% no-repeat,
      radial-gradient(circle at 50% 32%,
        color-mix(in srgb, var(--pv-candle-glow, #ffc75a) 40%, transparent),
        color-mix(in srgb, var(--pv-candle-glow, #ffc75a) 12%, transparent) 14%, transparent 36%);
    opacity: var(--pv-flame-o, 0.9);
    /* a láng töve áttetsző: a kanóc átsejlik rajta, ahogy az igazi lángban */
    -webkit-mask: radial-gradient(ellipse 4% 5% at 50% 42.5%, rgb(0 0 0 / 0.35), #000 100%);
    mask: radial-gradient(ellipse 4% 5% at 50% 42.5%, rgb(0 0 0 / 0.35), #000 100%);
    --pv-glow-a: pv-flame-lick 2.9s ease-in-out infinite, pv-flame-sway 6.7s ease-in-out infinite,
      pv-flame-light 4.3s ease-in-out infinite;
  }

  @keyframes pv-flame-lick {
  0%, 100% { scale: 1 1; }   11% { scale: 0.97 1.05; } 23% { scale: 1.02 0.96; } 37% { scale: 0.98 1.07; }
  52% { scale: 1.01 0.98; } 61% { scale: 0.96 1.1; }  74% { scale: 1.03 0.95; } 88% { scale: 0.99 1.03; }
  }
  @keyframes pv-flame-sway {
  0%, 100% { rotate: 0deg; } 20% { rotate: 1.2deg; } 45% { rotate: -0.8deg; } 58% { rotate: 2.2deg; }
  63% { rotate: -1.6deg; } 70% { rotate: 0.6deg; } 85% { rotate: -1deg; }
  }
  @keyframes pv-flame-light {
  0%, 100% { opacity: var(--pv-flame-o, 0.9); } 30% { opacity: calc(var(--pv-flame-o, 0.9) * 0.86); }
  55% { opacity: var(--pv-flame-o, 0.9); } 62% { opacity: calc(var(--pv-flame-o, 0.9) * 0.76); }
  80% { opacity: calc(var(--pv-flame-o, 0.9) * 0.95); }
  }

  /* Csökkentett mozgás: a láng megáll, az ÁLLÓ lángkép marad */
  @media (prefers-reduced-motion: reduce) {
    .candle__flame { animation: none; --pv-flame-img: var(--sv-flame); }
  }
</style>
</head>
<body>
  <h1>Élő gyertya</h1>
  <div class="candle" role="img" aria-label="Égő gyertya kerámiatálban, lobogó lánggal">
    <i class="candle__body"></i>
    <span class="candle__flame"></span>
  </div>
  <p>Egyetlen CSS-elem, kép nélkül: SVG-maszk, rétegzett átmenetek és saját ütemben lobogó láng. A színek állíthatók – próbáld ki a palettákat.</p>
  <div class="controls" role="group" aria-label="Megjelenés">
    <button type="button" data-theme="light" aria-pressed="true">Világos</button>
    <button type="button" data-theme="dark" aria-pressed="false">Sötét</button>
    <button type="button" data-pal="szandi" aria-pressed="true">Krém és burgundi</button>
    <button type="button" data-pal="honey" aria-pressed="false">Méz és terrakotta</button>
    <button type="button" data-pal="ivory" aria-pressed="false">Elefántcsont és pala</button>
  </div>
<script>
  /* Paletták: csak a tokenek cserélődnek, a rajz ugyanaz */
  const PAL = {
    szandi: { wax: "color-mix(in srgb, #F5DEB3 60%, #FFFBF3)", dish: "#5B3F3E", light: "#A7B58C", dark: "#1C2117" },
    honey:  { wax: "#F2D49B", dish: "#A0522D", light: "#E9DCC6", dark: "#1F1813" },
    ivory:  { wax: "#FAF6EC", dish: "#4A5561", light: "#C9D3DA", dark: "#14191E" },
  };
  const root = document.documentElement;
  let theme = "light", pal = "szandi";
  function apply() {
    const p = PAL[pal];
    root.dataset.theme = theme;
    root.style.setProperty("--pv-candle-wax", p.wax);
    root.style.setProperty("--pv-candle-dish", p.dish);
    root.style.setProperty("--page-bg", p[theme]);
    document.querySelectorAll("[data-theme]:not(html)").forEach((b) => b.setAttribute("aria-pressed", b.dataset.theme === theme));
    document.querySelectorAll("[data-pal]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.pal === pal));
  }
  document.querySelector(".controls").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.theme) theme = b.dataset.theme; else pal = b.dataset.pal;
    apply();
  });
</script>
</body>
